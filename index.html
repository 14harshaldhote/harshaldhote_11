    <!-- Set the theme before first paint so there is no light/dark flash. -->
    <script>
      (function () {
        var theme = 'light';
        try {
          theme = localStorage.getItem('theme') ||
            (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        } catch (e) {}
        document.documentElement.dataset.theme = theme;
      })();
    </script>
